<script>
'use strict';const $=id=>document.getElementById(id),money=n=>'$'+n.toFixed(2);let employee='',view='dashboard',metrics={received:0,putaway:0,picked:0,counts:0,exceptions:0},activity=[];
const products=[['1001','Work Gloves',120,'A-01-01'],['1002','Safety Glasses',85,'A-01-02'],['1003','Tape Rolls',200,'A-02-01'],['1004','Packing Boxes',150,'A-02-02'],['1005','Flashlights',55,'B-01-01'],['1006','Work Boots',40,'B-01-02'],['1007','Clipboards',75,'B-02-01'],['1008','High-Vis Vests',90,'B-02-02'],['1009','Battery Packs',65,'C-01-01'],['1010','First Aid Kits',35,'C-01-02'],['1011','Hard Hats',70,'C-02-01'],['1012','Utility Knives',110,'C-02-02']].map(([sku,name,qty,bin])=>({sku,name,qty,bin}));
const receipts=[{id:'PO-2401',sku:'1001',expected:24,actual:24,damaged:0,status:'Pending'},{id:'PO-2402',sku:'1005',expected:18,actual:16,damaged:2,status:'Pending'},{id:'PO-2403',sku:'1008',expected:30,actual:30,damaged:0,status:'Pending'},{id:'PO-2404',sku:'1010',expected:12,actual:11,damaged:0,status:'Pending'}];
const orders=[{id:'SO-5001',lines:[['1001',4],['1003',6]],status:'Open'},{id:'SO-5002',lines:[['1008',3],['1010',2]],status:'Open'},{id:'SO-5003',lines:[['1005',2],['1009',4]],status:'Open'}];
let pending=[],pickState={},counts={},selectedPO='',selectedOrder='',packingOrder='',packages={};
const product=sku=>products.find(p=>p.sku===sku),name=sku=>product(sku)?.name||sku,log=s=>{activity.unshift(new Date().toLocaleTimeString()+' · '+s);activity=activity.slice(0,15)},msg=(s,bad=false)=>{$('msg').textContent=s;$('msg').className=bad?'bad':'good'};

const help={dashboard:'Select a workflow. Receiving adds stock to a pending putaway queue. Putaway places it in storage. Picking removes stock from available inventory. Cycle counting compares physical counts against system quantities.',receive:'Scan SHP-1001 to open the truck shipment. Scan one of ten box labels (BOX-001 through BOX-010), then scan each unit by SKU. Reconcile every box and document shortages, overages, or damage. Print the practice barcode sheet to use a keyboard-mode scanner.',putaway:'Select a pending receipt, scan or type its SKU, then enter the correct bin label to store the goods. The stock becomes available only after successful putaway.',pick:'Choose a customer order. For each line, enter the correct SKU and bin location, then scan/pick the requested quantity. Wrong SKUs, wrong bins, and insufficient stock are rejected.',packing:'Pack picked orders, verify contents, choose a carton and package weight, then generate a printable practice shipping label. Browser printing supports compatible printers including thermal printers with a configured driver.',count:'Select a SKU and enter a physical count. The system compares it to the expected quantity and records any discrepancy. This is a simulated count; use fictional values.',inventory:'Review available quantities and storage locations. Quantities increase after putaway and decrease after order picking. All data resets when the page is refreshed.',performance:'Review completed receipts, putaways, picked orders, counts, and exception reports. These figures are for your current practice session only.'};
function safe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

const shipment={id:'SHP-1001',supplier:'Skills Distribution (fictional)',boxes:[
{id:'BOX-001',items:[['1001',4],['1002',3]]},
{id:'BOX-002',items:[['1003',5],['1004',2]]},
{id:'BOX-003',items:[['1003',4],['1007',2]]},
{id:'BOX-004',items:[['1005',3],['1009',2]]},
{id:'BOX-005',items:[['1008',4],['1002',2]]},
{id:'BOX-006',items:[['1010',3],['1011',2]]},
{id:'BOX-007',items:[['1011',4],['1006',2]]},
{id:'BOX-008',items:[['1009',4],['1012',3]]},
{id:'BOX-009',items:[['1007',3],['1004',2]]},
{id:'BOX-010',items:[['1001',5],['1008',2]]}
]};
let receivingStage='shipment',activeBox=null,boxScans={},boxIssues={},shipmentClosed=false;
const expectedFor=b=>Object.fromEntries(b.items);
const scannedFor=id=>boxScans[id]||{};
const boxesDone=()=>shipment.boxes.filter(b=>boxIssues[b.id]?.closed).length;
const totalExpected=()=>shipment.boxes.reduce((n,b)=>n+b.items.reduce((v,i)=>v+i[1],0),0);
const totalScanned=()=>Object.values(boxScans).reduce((n,items)=>n+Object.values(items).reduce((a,b)=>a+b,0),0);
function receiveNotice(t){msg(t)}
function renderReceive(c){
const done=boxesDone(),scanCount=totalScanned();
c.innerHTML='<div class="card"><h2>Inbound Receiving · Truck 01</h2><p class="muted">Supplier: '+shipment.supplier+' · Shipment barcode: <strong>'+shipment.id+'</strong></p><div class="row"><span class="pill">Boxes '+done+'/10</span><span class="pill">Units scanned '+scanCount+'/'+totalExpected()+'</span><span class="pill">Exceptions '+Object.values(boxIssues).filter(x=>x?.issue).length+'</span></div><p class="muted">Scan with a USB/Bluetooth keyboard-mode scanner or type each code and press Enter. Product scans count one unit at a time.</p><button id="printReceiveLabels" class="secondary">Print Training Barcode Sheets</button></div><div id="receiveTask"></div>';
$('printReceiveLabels').onclick=printReceivingLabels;
if(shipmentClosed){$('receiveTask').innerHTML='<div class="card"><h3>Shipment Completed</h3><p>All ten boxes reconciled. Usable stock is queued for Putaway.</p></div>';return}
if(receivingStage==='shipment'){
$('receiveTask').innerHTML='<div class="card"><h3>1. Truck arrival: Scan shipment</h3><form id="shipmentForm" class="row"><label>Shipment barcode<br><input id="shipmentScan" placeholder="SHP-1001" autocomplete="off" required autofocus></label><button>Open Manifest</button></form></div>';
$('shipmentForm').onsubmit=e=>{e.preventDefault();if($('shipmentScan').value.trim().toUpperCase()!==shipment.id)return msg('Shipment barcode does not match the manifest.',true);receivingStage='boxes';render();receiveNotice('Shipment verified. Scan a box to begin.')};$('shipmentScan').focus();return
}
const box=shipment.boxes.find(b=>b.id===activeBox);
if(!box){
$('receiveTask').innerHTML='<div class="card"><h3>2. Scan a box</h3><div class="grid">'+shipment.boxes.map(b=>'<div class="tile"><strong>'+b.id+'</strong><span>'+(boxIssues[b.id]?.closed?'Completed': 'Awaiting scan')+'</span></div>').join('')+'</div><form id="boxForm" class="row" style="margin-top:18px"><label>Box barcode<br><input id="boxScan" placeholder="BOX-001" autocomplete="off" required autofocus></label><button>Open Box</button></form>'+(done===10?'<p><button id="closeShipment">Reconcile & Complete Shipment</button></p>':'')+'</div>';
$('boxForm').onsubmit=e=>{e.preventDefault();const id=$('boxScan').value.trim().toUpperCase(),b=shipment.boxes.find(x=>x.id===id);if(!b)return msg('Unknown box barcode. Flag unexpected boxes with a supervisor.',true);if(boxIssues[id]?.closed)return msg('This box has already been completed.',true);activeBox=id;render();receiveNotice('Box '+id+' opened. Scan every unit individually.')};
if(done===10)$('closeShipment').onclick=()=>{shipmentClosed=true;metrics.received++;log('Shipment '+shipment.id+' reconciled with '+Object.values(boxIssues).filter(x=>x?.issue).length+' box exceptions');render();receiveNotice('Shipment completed. Go to Putaway to store usable inventory.')};
$('boxScan').focus();return
}
const scans=scannedFor(box.id),exp=expectedFor(box),issue=boxIssues[box.id]||{};
$('receiveTask').innerHTML='<div class="card"><h3>3. Scan items · '+box.id+'</h3><p>Scan one barcode per physical item. If the physical quantity differs, document the exception before closing.</p><div class="scroll"><table><tr><th>SKU</th><th>Product</th><th>Expected</th><th>Scanned</th></tr>'+box.items.map(([sku,n])=>'<tr><td>'+sku+'</td><td>'+name(sku)+'</td><td>'+n+'</td><td>'+(scans[sku]||0)+'</td></tr>').join('')+'</table></div><form id="unitForm" class="row"><label>Item barcode<br><input id="unitScan" placeholder="1001" autocomplete="off" required autofocus></label><button>Scan Item</button></form><div class="row"><button id="undoUnit" class="secondary">Undo Last Scan</button><button id="finishBox">Verify & Close Box</button></div><p class="muted">For damage, scan the unit first and record the damaged quantity when closing the box.</p></div>';
$('unitForm').onsubmit=e=>{e.preventDefault();const sku=$('unitScan').value.trim();if(!product(sku))return msg('Unrecognized item barcode. Set aside and report the product.',true);if(!boxScans[box.id])boxScans[box.id]={};boxScans[box.id][sku]=(boxScans[box.id][sku]||0)+1;window.lastReceiveScan={box:box.id,sku};render();receiveNotice('Scanned '+name(sku)+' · '+boxScans[box.id][sku]+' units in box.')};
$('undoUnit').onclick=()=>{const x=window.lastReceiveScan;if(!x||x.box!==box.id||!boxScans[box.id]?.[x.sku])return msg('No recent scan to undo.',true);boxScans[box.id][x.sku]--;window.lastReceiveScan=null;render();receiveNotice('Last scan undone.')};
$('finishBox').onclick=()=>showBoxReconcile(box);$('unitScan').focus()
}
function showBoxReconcile(box){
const scanned=scannedFor(box.id),expected=expectedFor(box),all=[...new Set([...Object.keys(expected),...Object.keys(scanned)])],diff=all.filter(sku=>(expected[sku]||0)!==(scanned[sku]||0));
$('receiveTask').innerHTML='<div class="card"><h3>4. Verify '+box.id+'</h3><div class="scroll"><table><tr><th>SKU</th><th>Expected</th><th>Scanned</th><th>Variance</th></tr>'+all.map(sku=>'<tr><td>'+sku+' · '+name(sku)+'</td><td>'+(expected[sku]||0)+'</td><td>'+(scanned[sku]||0)+'</td><td>'+((scanned[sku]||0)-(expected[sku]||0))+'</td></tr>').join('')+'</table></div><form id="reconcileForm"><p><label>Damaged units (included in scanned count) <input type="number" id="damageCount" min="0" step="1" value="0" required></label></p><p><label>Exception notes <input id="issueNotes" placeholder="Shortage, overage, damage, wrong SKU..."></label></p><p class="muted">'+(diff.length?'Quantity mismatch detected. Describe the discrepancy before closing.':'All expected quantities match. Document any damage if applicable.')+'</p><div class="row"><button type="button" class="secondary" id="backToScan">Continue Scanning</button><button>Close Box</button></div></form></div>';
$('backToScan').onclick=()=>render();
$('reconcileForm').onsubmit=e=>{e.preventDefault();const damaged=Number($('damageCount').value),sum=Object.values(scanned).reduce((a,b)=>a+b,0),notes=$('issueNotes').value.trim();if(!Number.isInteger(damaged)||damaged<0||damaged>sum)return msg('Damaged quantity must be within scanned units.',true);if((diff.length||damaged)&&!notes)return msg('Enter exception notes for discrepancies or damage.',true);if(damaged){const itemTypes=Object.keys(scanned).filter(sku=>scanned[sku]>0);if(itemTypes.length>1)return showDamageAllocation(box,damaged,notes,diff);return closeBox(box,{[itemTypes[0]]:damaged},notes,diff)}closeBox(box,{},notes,diff)}
}
function showDamageAllocation(box,total,notes,diff){
const scanned=scannedFor(box.id);
$('receiveTask').innerHTML='<div class="card"><h3>Allocate damaged units by SKU</h3><p>Specify which scanned products were damaged. Total damaged: '+total+'</p><form id="damageForm">'+Object.entries(scanned).filter(([sku,q])=>q>0).map(([sku,q])=>'<p><label>'+sku+' · '+name(sku)+' (scanned '+q+') <input type="number" data-damage="'+sku+'" min="0" max="'+q+'" step="1" value="0" required></label></p>').join('')+'<button>Confirm & Close Box</button></form></div>';
$('damageForm').onsubmit=e=>{e.preventDefault();const allocation={};let sum=0;document.querySelectorAll('[data-damage]').forEach(input=>{const n=Number(input.value);allocation[input.dataset.damage]=n;sum+=n});if(sum!==total)return msg('Damaged units by SKU must total '+total+'.',true);closeBox(box,allocation,notes,diff)}
}
function closeBox(box,damages,notes,diff){
const scanned=scannedFor(box.id),damageTotal=Object.values(damages).reduce((a,b)=>a+b,0);
for(const [sku,n] of Object.entries(scanned)){const good=n-(damages[sku]||0);if(good>0)pending.push({id:box.id,sku,qty:good})}
const issue=Boolean(diff.length||damageTotal);
boxIssues[box.id]={closed:true,issue,notes,damages};
if(issue){metrics.exceptions++;log(box.id+' exception: '+notes)}else log(box.id+' verified');
activeBox=null;window.lastReceiveScan=null;render();receiveNotice(box.id+' closed. '+(issue?'Exception documented. ':'')+'Usable units queued for Putaway.')
}
const code39Patterns={'0':'101001101101','1':'110100101011','2':'101100101011','3':'110110010101','4':'101001101011','5':'110100110101','6':'101100110101','7':'101001011011','8':'110100101101','9':'101100101101','A':'110101001011','B':'101101001011','C':'110110100101','D':'101011001011','E':'110101100101','F':'101101100101','G':'101010011011','H':'110101001101','I':'101101001101','J':'101011001101','K':'110101010011','L':'101101010011','M':'110110101001','N':'101011010011','O':'110101101001','P':'101101101001','Q':'101010110011','R':'110101011001','S':'101101011001','T':'101011011001','U':'110010101011','V':'100110101011','W':'110011010101','X':'100101101011','Y':'110010110101','Z':'100110110101','-':'100101011011','*':'100101101101'};
function barcodeSVG(value){const chars='*'+value.toUpperCase()+'*';let x=12,rects='';for(const ch of chars){const bits=code39Patterns[ch];if(!bits)return '';for(const bit of bits){const width=bit==='1'?3:1;if(bit==='1')rects+='<rect x="'+x+'" y="0" width="'+width+'" height="52"/>';x+=width}x+=2}return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(x+12)+' 52" width="100%" height="65" preserveAspectRatio="none">'+rects+'</svg>'}
function printReceivingLabels(){const labels=[shipment.id,...shipment.boxes.map(b=>b.id),...products.map(p=>p.sku)];const html='<!doctype html><html><head><title>Warehouse Training Barcodes</title><style>body{font:14px Arial;margin:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.label{border:1px dashed #888;padding:12px;break-inside:avoid;text-align:center}.label strong{display:block;margin:6px}h2{grid-column:1/-1}@media print{body{margin:10mm}}</style></head><body><h1>Skills Warehouse · Scan Practice</h1><p>Fictional training labels. Print at 100% scale. Scanner must support Code 39 and keyboard mode.</p><div class="grid">'+labels.map((v,i)=>'<div class="label"><strong>'+(i===0?'SHIPMENT':i<=10?'BOX':'ITEM')+' · '+v+'</strong>'+barcodeSVG(v)+'<div>'+v+'</div></div>').join('')+'</div></body></html>';const w=window.open('','_blank');if(!w)return msg('Allow pop-ups to print barcode sheets.',true);w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),300)}
function renderPutaway(c){c.innerHTML='<div class="card"><h2>Putaway · Pending Stock</h2><p class="muted">Verify product and scan the storage location before adding stock.</p><div class="scroll"><table><tr><th>Receipt</th><th>SKU</th><th>Product</th><th>Qty</th><th>Bin</th><th></th></tr>'+pending.map((r,i)=>'<tr><td>'+r.id+'</td><td>'+r.sku+'</td><td>'+name(r.sku)+'</td><td>'+r.qty+'</td><td>'+product(r.sku).bin+'</td><td><button data-i="'+i+'">Putaway</button></td></tr>').join('')+'</table></div>'+(pending.length?'':'<p>No pending stock. Receive a purchase order first.</p>')+'</div><div id="task"></div>';c.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i),r=pending[i];$('task').innerHTML='<div class="card"><h3>Store '+name(r.sku)+'</h3><p>Quantity: '+r.qty+' units · Target bin: '+product(r.sku).bin+'</p><form id="putForm" class="row"><label>Scan product SKU<br><input id="pSku" required></label><label>Scan bin label<br><input id="pBin" required></label><button>Confirm Putaway</button></form></div>';$('putForm').onsubmit=e=>{e.preventDefault();if($('pSku').value.trim()!==r.sku||$('pBin').value.trim().toUpperCase()!==product(r.sku).bin)return msg('SKU or bin mismatch. Check the location label.',true);product(r.sku).qty+=r.qty;pending.splice(i,1);metrics.putaway++;log('Put away '+r.qty+' '+name(r.sku)+' to '+product(r.sku).bin);render();msg('Putaway completed. Inventory updated.')}})}
function renderPick(c){c.innerHTML='<div class="card"><h2>Order Picking</h2><div class="scroll"><table><tr><th>Order</th><th>Lines</th><th>Status</th><th></th></tr>'+orders.map(o=>'<tr><td>'+o.id+'</td><td>'+o.lines.length+'</td><td>'+o.status+'</td><td><button data-order="'+o.id+'" '+(o.status!=='Open'?'disabled':'')+'>Pick</button></td></tr>').join('')+'</table></div></div><div id="task"></div>';c.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{selectedOrder=b.dataset.order;drawPickTask()});if(selectedOrder&&orders.find(o=>o.id===selectedOrder)?.status==='Open')drawPickTask()}
function drawPickTask(){const o=orders.find(x=>x.id===selectedOrder);if(!o)return;const done=pickState[o.id]||{};$('task').innerHTML='<div class="card"><h3>Picking '+o.id+'</h3><div class="scroll"><table><tr><th>SKU</th><th>Product</th><th>Required</th><th>Picked</th><th>Bin</th></tr>'+o.lines.map(([sku,qty])=>'<tr><td>'+sku+'</td><td>'+name(sku)+'</td><td>'+qty+'</td><td>'+(done[sku]||0)+'</td><td>'+product(sku).bin+'</td></tr>').join('')+'</table></div><form id="pickForm" class="row"><label>Scan SKU<br><input id="pickSku" required></label><label>Scan bin<br><input id="pickBin" required></label><label>Quantity<br><input id="pickQty" type="number" min="1" step="1" required></label><button>Confirm Pick</button></form></div>';$('pickForm').onsubmit=e=>{e.preventDefault();const sku=$('pickSku').value.trim(),bin=$('pickBin').value.trim().toUpperCase(),qty=Number($('pickQty').value),line=o.lines.find(l=>l[0]===sku),p=product(sku);if(!line)return msg('This SKU is not on the order.',true);if(bin!==p.bin)return msg('Incorrect bin. Verify the shelf label.',true);if(!Number.isInteger(qty)||qty<1||qty+(done[sku]||0)>line[1])return msg('Quantity exceeds the remaining order requirement.',true);if(p.qty<qty)return msg('Not enough available stock. Investigate the shortage.',true);p.qty-=qty;done[sku]=(done[sku]||0)+qty;pickState[o.id]=done;if(o.lines.every(([s,n])=>done[s]===n)){o.status='Picked';metrics.picked++;log('Completed picking '+o.id);selectedOrder='';render();msg('Order picked successfully. Stock quantities updated.')}else{drawPickTask();msg('Line picked. Continue with remaining items.')}}}

function renderPacking(c){
c.innerHTML='<div class="card"><h2>Packing & Label Printing</h2><p>Complete an order in Order Picking first. Practice labels are fictional and cannot be used for shipping.</p><table><tr><th>Order</th><th>Status</th><th>Action</th></tr>'+orders.map(o=>'<tr><td>'+o.id+'</td><td>'+o.status+'</td><td><button data-pack="'+o.id+'" '+(o.status==='Open'?'disabled':'')+'>'+(o.status==='Packed'?'View label':'Pack order')+'</button></td></tr>').join('')+'</table></div><div id="task"></div>';
c.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>{packingOrder=b.dataset.pack;showPacking()});
if(packingOrder&&orders.find(o=>o.id===packingOrder)?.status!=='Open')showPacking()
}
function showPacking(){
const o=orders.find(x=>x.id===packingOrder);if(!o)return;
const p=packages[o.id];
$('task').innerHTML='<div class="card"><h3>'+o.id+'</h3><p>Verify: '+o.lines.map(([sku,q])=>q+' × '+name(sku)+' ('+sku+')').join(', ')+'</p>'+(p?'<p>Package: '+p.box+' · '+p.weight+' lb · '+p.ref+'</p><button id="printLabel">Print 4 × 6 Practice Label</button>':'<form id="packForm"><p><label>Packaging <select id="box"><option>Small carton</option><option>Medium carton</option><option>Large carton</option><option>Padded mailer</option></select></label></p><p><label>Weight (lb) <input id="weight" type="number" min="0.1" max="150" step="0.1" required></label></p><p><label><input type="checkbox" id="verify" required> I verified the contents</label></p><button>Create Practice Label</button></form>')+'</div>';
if(p){$('printLabel').onclick=()=>printPackingLabel(o,p)}
else $('packForm').onsubmit=e=>{e.preventDefault();const weight=Number($('weight').value);if(!Number.isFinite(weight)||weight<=0||weight>150)return msg('Invalid weight',true);packages[o.id]={box:$('box').value,weight,ref:'DEMO-'+o.id};o.status='Packed';log('Packed '+o.id);render();msg('Practice label created. You can now print it.')}
}
function printPackingLabel(o,p){
const doc='<!doctype html><html><head><title>Practice Label</title><style>@page{size:4in 6in;margin:0}body{font:16px Arial;padding:16px;width:3.7in}section{border:2px solid black;padding:12px;margin:12px 0}strong{font-size:20px}</style></head><body><strong>SKILLS PRACTICE LABEL</strong><p>NOT VALID FOR SHIPPING</p><section>FROM: Training Warehouse<br>100 Demo St<br>Practice, NY 00000</section><section>TO: Fictional Customer<br>200 Sample Rd<br>Example, NY 00000</section><section>ORDER: '+o.id+'<br>PACKAGE: '+p.box+'<br>WEIGHT: '+p.weight+' lb<br>REFERENCE: '+p.ref+'</section><p>SIMULATION ONLY · NO POSTAGE</p></body></html>';
const w=window.open('','_blank');if(!w)return msg('Please allow popups to print',true);w.document.write(doc);w.document.close();w.focus();setTimeout(()=>w.print(),250)
}

function renderCount(c){c.innerHTML='<div class="card"><h2>Cycle Count</h2><p class="muted">Enter a physical count for a product. Compare against the system quantity after submission.</p><form id="countForm" class="row"><label>Product<br><select id="countSku">'+products.map(p=>'<option value="'+p.sku+'">'+p.sku+' · '+p.name+' ('+p.bin+')</option>').join('')+'</select></label><label>Physical quantity<br><input type="number" id="countQty" min="0" step="1" required></label><button>Submit Count</button></form><div id="countResult"></div></div>';$('countForm').onsubmit=e=>{e.preventDefault();const p=product($('countSku').value),qty=Number($('countQty').value);if(!Number.isInteger(qty)||qty<0)return msg('Enter a valid nonnegative whole number.',true);const diff=qty-p.qty;metrics.counts++;if(diff)metrics.exceptions++;log('Counted '+p.sku+': physical '+qty+', system '+p.qty+(diff?' · variance '+diff:''));$('countResult').innerHTML='<div class="notice"><strong>'+safe(p.name)+'</strong><p>System: '+p.qty+' · Physical: '+qty+' · Variance: '+(diff>0?'+':'')+diff+'</p><p>'+(diff?'Discrepancy flagged for supervisor review. Inventory was not automatically adjusted.':'Count matches the system.')+'</p></div>';msg(diff?'Discrepancy documented.':'Count verified.')}}
function renderInventory(c){c.innerHTML='<div class="card"><h2>Available Inventory</h2><p class="muted">Usable stock only. Pending putaway is not yet included.</p><div class="scroll"><table><tr><th>SKU</th><th>Product</th><th>Available</th><th>Storage Bin</th></tr>'+products.map(p=>'<tr><td>'+p.sku+'</td><td>'+p.name+'</td><td>'+p.qty+'</td><td>'+p.bin+'</td></tr>').join('')+'</table></div></div>'}
function renderPerformance(c){c.innerHTML='<div class="card"><h2>Session Performance</h2><div class="grid">'+Object.entries({Receipts:metrics.received,Putaways:metrics.putaway,'Orders Picked':metrics.picked,'Cycle Counts':metrics.counts,'Exceptions Recorded':metrics.exceptions}).map(([k,v])=>'<div class="tile"><strong>'+v+'</strong>'+k+'</div>').join('')+'</div><p class="muted">Practice metrics are not saved after refresh. Errors and exceptions are learning opportunities, not employment assessments.</p></div><div class="card"><h3>Activity Log</h3>'+(activity.length?'<ul>'+activity.map(s=>'<li>'+safe(s)+'</li>').join('')+'</ul>':'<p>No activity yet.</p>')+'</div>'}
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;if(!t||!['rSku','pSku','pBin','pickSku','pickBin'].includes(t.id))return;const fields=[...t.closest('form').querySelectorAll('input')];const i=fields.indexOf(t);if(i<fields.length-1){e.preventDefault();fields[i+1].focus();fields[i+1].select()}});function updateHelp(){$('helpTitle').textContent=screens[view]+' Help';$('helpText').textContent=help[view]}
$('login').onsubmit=e=>{e.preventDefault();const id=$('emp').value;if(!/^\d{4}$/.test(id))return;employee=id;$('who').textContent='Employee '+id;$('gate').hidden=true;$('app').hidden=false;$('helpFab').hidden=false;setView('dashboard')};
$('logout').onclick=()=>{employee='';$('emp').value='';$('app').hidden=true;$('gate').hidden=false;$('helpFab').hidden=true;$('helpPanel').hidden=true};
$('helpFab').onclick=()=>{$('helpPanel').hidden=!$('helpPanel').hidden;$('helpFab').setAttribute('aria-expanded',String(!$('helpPanel').hidden));if(!$('helpPanel').hidden)updateHelp()};$('helpClose').onclick=()=>{$('helpPanel').hidden=true;$('helpFab').setAttribute('aria-expanded','false')};
</script></body></html>
